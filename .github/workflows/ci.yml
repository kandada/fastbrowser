name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: English-only source
        run: python3 scripts/check-english.py src tests examples benches
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --features engine-cdp --all-targets
      - name: Test
        # Real-Chromium integration tests auto-SKIP when no browser is present.
        run: cargo test --features engine-cdp
