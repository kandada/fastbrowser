# 最小依赖清单（对齐 fastshell 的 Cargo_min.toml）。
# 默认 feature（engine-mock）下仅需 serde/serde_json/base64/flate2。
[package]
name = "fastbrowser"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["engine-mock"]
engine-mock = []
engine-cdp = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:async-trait"]
engine-cef = ["dep:cef", "engine-cdp"]
engine-webview = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.1"   # 极简 PNG 解码器（IDAT inflate）
