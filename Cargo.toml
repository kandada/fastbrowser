[package]
name = "fastbrowser"
version = "0.1.6"
edition = "2021"
description = "Cross-platform browser automation kernel for AI agents"
license = "Apache-2.0"
authors = ["xiefujin <490021684@qq.com>"]
repository = "https://github.com/kandada/fastbrowser"
readme = "README.md"
keywords = ["browser", "automation", "ai-agent", "cdp", "webview"]
categories = ["command-line-utilities", "development-tools"]
# Ship only the Rust kernel (+ docs/examples/benches/tests). Keep other-language
# bindings, the C-ABI sources, device runners, scripts, and the alternate
# manifest out of the crates.io archive.
exclude = [
    "bindings/",
    "real-device/",
    "fastbrowser_c/",
    "scripts/",
    ".github/",
    "Cargo_min.toml",
]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "fastbrowser"
path = "src/bin/main.rs"

[features]
default = ["engine-mock"]
# 真 Chromium 的重型集成测试（默认不跑；用 scripts/cdp-full.sh 显式运行）
heavy-tests = []
# 内存参考引擎（无外部依赖，CLI/测试/文档示例开箱即用）
engine-mock = []
# 共享 CDP 客户端（websocket），被 cef 引擎复用，也可独立使用
engine-cdp = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:async-trait",
]
# 异步壳（AsyncFastbrowser）：async 工具调用 + 每标签事件推送 + 多标签编排/并发。
# For async hosts and the async-agent ecosystem; the sync shell (C ABI/CLI) is unaffected.
async-core = ["dep:tokio"]
# 桌面端 CEF 引擎（需要 scripts/fetch-cef.sh 拉取预编译包到 vendor/cef/）
engine-cef = ["dep:cef", "engine-cdp"]
# 移动端系统 WebView 引擎（宿主提供 WebViewOps，经 sdk::plugin 注册）
engine-webview = []
# 电脑操作表面层（async-first）：统一 UiNode 模型 + async SurfaceProvider + 注册表 + 同步外壳。
# 浏览器作为第一个 provider（web 表面）；平台原生后端另行 feature 门控。
surface = ["dep:async-trait", "dep:tokio"]
# macOS 原生无障碍后端（AXUIElement）+ 坐标输入（CGEvent）。仅 macOS 可编译。
surface-macos = [
    "surface",
    "dep:accessibility",
    "dep:accessibility-sys",
    "dep:core-foundation",
    "dep:core-graphics",
]
# Linux 原生无障碍后端（AT-SPI via zbus）。仅 Linux 可运行；可跨平台编译校验。
surface-linux = ["surface", "dep:atspi"]
# Windows 原生无障碍后端（UI Automation）。仅 Windows 可运行；可交叉 check。
surface-windows = ["surface", "dep:uiautomation"]
# 移动端原生无障碍后端（Android AccessibilityService）：内核侧 provider 只做协议
# 适配，真实能力由 App（Kotlin）经 JNI/C ABI 以 SurfaceOps 注入。
surface-android = ["surface"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.1"   # 极简 PNG 解码器（IDAT inflate）
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] } # screenshot 的 png/jpeg 编码
ureq = { version = "2", default-features = false, features = ["tls"] } # download 工具：轻量 HTTPS 客户端
cef = { version = "151", optional = true } # tauri-apps/cef-rs
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake"], optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
# macOS 无障碍（surface-macos）：系统框架动态链接，仅绑定代码进二进制。
accessibility = { version = "0.2", optional = true }
accessibility-sys = { version = "0.2", optional = true }
core-foundation = { version = "0.10", optional = true }
core-graphics = { version = "0.25", optional = true, features = ["highsierra"] }
# Linux AT-SPI（surface-linux）：纯 Rust（zbus），仅在 Linux 运行。
atspi = { version = "0.30", optional = true, default-features = false, features = ["connection", "proxies", "wrappers", "tokio", "zbus"] }
# Windows UI Automation（surface-windows）：仅 Windows 运行。
uiautomation = { version = "0.24", optional = true }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "snapshot"
harness = false
path = "benches/snapshot.rs"

[[bench]]
name = "perf"
harness = false
path = "benches/perf.rs"

# Release profile tuned for the Android staticlib (对齐 fastshell 根 workspace):
# LTO strips dead code across crates, single codegen unit improves both size and
# speed, symbol stripping trims the archive. Panics stay unwinding so a failing
# tool call cannot take down the host app.
[profile.release]
lto = true
codegen-units = 1
strip = true
